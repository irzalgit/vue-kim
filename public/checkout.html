<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Premium Math315</title>

<style>
* { box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
}
.card {
  background: #ffffff;
  padding: 30px 25px;
  border-radius: 16px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
  transition: transform 0.3s ease;
}
.card:hover { transform: translateY(-5px); }
h2 { margin: 0 0 20px 0; color: #333; text-align: center; font-weight: 600; font-size: 24px; }
label { display: block; margin-top: 12px; margin-bottom: 4px; color: #555; font-weight: 500; font-size: 14px; }
input, select, button {
  width: 100%;
  padding: 12px 14px;
  margin-top: 4px;
  border: 1.5px solid #e0e0e0;
  border-radius: 10px;
  font-size: 15px;
  transition: all 0.2s ease;
  background: #fafafa;
}
input:focus, select:focus {
  outline: none;
  border-color: #667eea;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}
input[readonly] { background: #f0f0f0; color: #666; cursor: default; }
button {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  font-weight: 600;
  cursor: pointer;
  border: none;
  margin-top: 24px;
  padding: 14px;
  font-size: 16px;
  letter-spacing: 0.5px;
  transition: all 0.3s ease;
}
button:hover { transform: scale(1.02); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4); }
button:disabled { background: #cccccc; cursor: not-allowed; transform: none; box-shadow: none; }
#price {
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  padding: 14px;
  border-radius: 10px;
  margin-top: 12px;
  font-weight: bold;
  font-size: 20px;
  color: #333;
  text-align: center;
  border: 1px solid #d4d4d4;
}
.status {
  margin-top: 20px;
  padding: 14px;
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.5;
  animation: fadeIn 0.3s ease;
}
.status strong { font-weight: 700; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.success { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
.error { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
.info { background: #d1ecf1; color: #0c5460; border-left: 4px solid #17a2b8; }
.warning { background: #fff3cd; color: #856404; border-left: 4px solid #ffc107; }
.loading {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid #f3f3f3;
  border-top: 2px solid #667eea;
  border-radius: 50%;

  margin-right: 8px;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
small { display: block; margin-top: 4px; color: #888; font-size: 12px; }
.google-btn {

  border: none;
  cursor: pointer;
  font-size: 16px;
  transition: background 0.3s ease;

.google-btn:hover { background: #357ae8; }

<body>

  <form id="form" style="display: none;">

    <label>📧 Email</label>
    <input id="email" readonly placeholder="Email Anda">
    <label>📦 Pilih Produk</label>
    <select id="product"><option value="">Memuat produk...</option></select>

    <input id="phone" type="tel" placeholder="081234567890" required>

    <div style="display: flex; gap: 10px; margin-top: 6px;">

      <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 8px;">
        <button type="button" id="confirmWaBtn" style="background: #16a34a; margin-top: 0; padding: 10px; font-size: 14px;">

    <button id="pay" disabled style="display: block;">💰 Bayar Sekarang</button>

<!-- QRCode Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
// ============================================================
// 🔥 FIREBASE CONFIG
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyCu4GQa-EOaPhpQP_y_QcsJxs05adQU2-M",
  authDomain: "math314-app.firebaseapp.com",
  databaseURL: "https://math314-app-default-rtdb.firebaseio.com",
  projectId: "math314-app",
  storageBucket: "math314-app.appspot.com",
  messagingSenderId: "9019551034",
  appId: "1:9019551034:web:de0c5e2b8b20c18ca0b403"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// ============================================================
// 📦 CONFIG & DOM
// ============================================================
const API_BASE = "https://math315.vercel.app";
const nameEl = document.getElementById("name");
const emailEl = document.getElementById("email");
const phoneEl = document.getElementById("phone");
const productEl = document.getElementById("product");
const priceEl = document.getElementById("price");
const payBtn = document.getElementById("pay");
const statusEl = document.getElementById("status");
const formEl = document.getElementById("form");
const loginSection = document.getElementById("loginSection");
const loginBtn = document.getElementById("loginBtn");

let currentUser = null;
let userToken = null;
let products = {};

// ============================================================
// 🔍 BACA QUERY PARAMETER
// ============================================================
const urlParams = new URLSearchParams(window.location.search);
const queryProductId = urlParams.get('productId');
const queryProductName = urlParams.get('productName');
const queryPrice = urlParams.get('price');
const queryToken = urlParams.get('token');
const queryPhone = urlParams.get('phone');
const queryName = urlParams.get('name');

window._checkoutData = {
  productId: queryProductId || null,
  productName: queryProductName || null,
  price: queryPrice ? parseInt(queryPrice) : null,
  token: queryToken ? parseInt(queryToken) : null,
  phone: queryPhone || null,
  name: queryName || null
};

// ============================================================
// 🧪 FALLBACK PRODUK
// ============================================================
const FALLBACK_PRODUCTS = {
  "token_50": {
    name: "Starter",
    price: 10000,
    description: "50 Token",
    token_amount: 50
  },
  "token_200": {
    name: "Pro",
    price: 35000,
    description: "200 Token",
    token_amount: 200
  },
  "token_500": {
    name: "Business",
    price: 75000,
    description: "500 Token",
    token_amount: 500
  },
  "token_1500": {
    name: "Enterprise",
    price: 150000,
    description: "1500 Token",
    token_amount: 1500
  }
};

// ============================================================
// 📋 HELPER FUNCTIONS
// ============================================================
function setStatus(message, type = "info") {
  statusEl.innerHTML = message;
  statusEl.className = `status ${type}`;
}
function validPhone(phone) { return /^08[0-9]{8,13}$/.test(phone); }
function formatRupiah(amount) { return `Rp ${Number(amount).toLocaleString("id-ID")}`; }
function getTokenAmountFromKey(key) {
  if (key.startsWith('token_')) {
    const num = parseInt(key.split('_')[1], 10);
    return isNaN(num) ? 0 : num;
  }
  return 0;
}

// 🔍 Cari produk berdasarkan berbagai kriteria
function findProductKey(productData, targetId, targetName, targetPrice) {
  // 1. Coba berdasarkan ID
  if (targetId && productData[targetId]) return targetId;

  // 2. Coba berdasarkan nama (case-insensitive)
  if (targetName) {
    const normalized = targetName.toLowerCase().trim();
    for (const key in productData) {
      if (productData[key].name.toLowerCase() === normalized) {
        return key;
      }
    }
  }

  // 3. Coba berdasarkan harga
  if (targetPrice) {
    for (const key in productData) {
      if (productData[key].price === targetPrice) {
        return key;
      }
    }
  }

  return null;
}

function renderProducts(productData) {
  // Injeksi produk kustom bila dikirim via URL query (misal: jualan poster)
  const data = window._checkoutData;
  if (data && data.price && (data.productId || data.productName)) {
    const customKey = data.productId || 'custom_order';
    if (!productData[customKey]) {
      productData[customKey] = {
        name: data.productName || 'Paket Pesanan Khusus',
        price: data.price,
        token_amount: data.token || 0,
        description: data.productName || 'Pesanan Khusus'
      };
    }
  }

  productEl.innerHTML = '<option value="">-- Pilih Produk --</option>';
  let hasProduct = false;
  for (const key in productData) {
    const p = productData[key];
    if (p && p.name && p.price) {
      hasProduct = true;
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = `${p.name} - ${formatRupiah(p.price)}`;
      productEl.appendChild(opt);
    }
  }
  if (!hasProduct) {
    productEl.innerHTML = '<option value="">❌ Tidak ada produk tersedia</option>';
    setStatus("⚠️ Belum ada produk yang tersedia", "warning");
  }

  // ======================= OTOMATIS PILIH PRODUK =======================
  if (data && (data.productId || data.productName || data.price)) {
    const foundKey = findProductKey(productData, data.productId, data.productName, data.price);
    if (foundKey) {
      productEl.value = foundKey;
      productEl.disabled = true;
      productEl.dispatchEvent(new Event('change'));
      validateForm();
    }
  }
}

// ============================================================
// 👤 TAMPILKAN FORM & LOAD USER DATA
// ============================================================
function enableCheckout(user) {
  nameEl.value = user.displayName || user.name || window._checkoutData.name || "User";
  emailEl.value = user.email || "";
  if (window._checkoutData.phone) {
    phoneEl.value = window._checkoutData.phone;
  }
  formEl.style.display = 'block';
  loginSection.style.display = 'none';
  const displayName = user.displayName || user.name || 'Pengguna';
  setStatus(`✅ Login berhasil sebagai <strong>${displayName}</strong>`, 'success');

  if (user.uid) {
    const userRef = db.ref(`users/${user.uid}`);
    userRef.once('value').then(snap => {
      const data = snap.val() || {};
      const badge = document.getElementById('creditBadge');
      if (typeof data.credits === 'number') {
        window._userCredits = data.credits;
        if (badge) {
          badge.style.display = 'block';
          badge.textContent = `Kredit saat ini: ${data.credits}`;
        }
      }
      if (data.phone && !phoneEl.value) {
        phoneEl.value = data.phone;
      }
      validateForm();
    }).catch(err => {
      console.warn("Gagal membaca profil user:", err);
    });
  }

  loadProducts();
  validateForm();
}

function showLoginRequired() {
  formEl.style.display = 'none';
  loginSection.style.display = 'block';
  setStatus('🔐 Login diperlukan untuk melanjutkan pembayaran', 'warning');
}

// ============================================================
// 🔐 AUTH STATE
// ============================================================
auth.onAuthStateChanged(async user => {
  if (!user) {
    showLoginRequired();
    loadProducts();
    return;
  }
  currentUser = user;
  try {
    userToken = await user.getIdToken();
  } catch (err) {
    setStatus("❌ Gagal autentikasi.", "error");
    return;
  }
  enableCheckout(user);
});

// ============================================================
// 📦 LOAD PRODUCTS
// ============================================================
async function loadProducts() {
  try {
    const snap = await db.ref("product").once("value");
    const data = snap.val() || {};
    if (data && Object.keys(data).length > 0) {
      for (const key in data) {
        if (!data[key].token_amount) data[key].token_amount = getTokenAmountFromKey(key);
      }
      products = data;
      renderProducts(products);
    } else {
      products = FALLBACK_PRODUCTS;
      renderProducts(products);
    }
  } catch (err) {
    products = FALLBACK_PRODUCTS;
    renderProducts(products);
  }
  validateForm();
}

// ============================================================
// ============================================================
// ✅ QRIS DANA DINAMIS (EMVCo Toko Poster Math315)
// ============================================================
const QRIS_STATIC_DANA = "00020101021126570011ID.DANA.WWW011893600915383556205402098355620540303UMI51440014ID.CO.QRIS.WWW0215ID10253755165860303UMI5204899953033605802ID5919Toko Poster Math3156014Kota Pekanbaru6105393936304DC0D";

function calculateCRC16(str) {
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++) {
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) {
      if ((crc & 0x8000) !== 0) {
        crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
      } else {
        crc = (crc << 1) & 0xFFFF;
      }
    }
  }
  return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
}

function generateDynamicQris(nominal) {
  let qris = QRIS_STATIC_DANA.trim();
  if (qris.includes('6304')) {
    qris = qris.substring(0, qris.lastIndexOf('6304'));
  }
  qris = qris.replace("010211", "010212");

  const nominalStr = parseInt(nominal, 10).toString();
  const lenStr = nominalStr.length.toString().padStart(2, '0');
  const tag54 = `54${lenStr}${nominalStr}`;

  const parts = qris.split("5802ID");
  const newQrisWithoutCrc = `${parts[0]}${tag54}5802ID${parts[1]}6304`;
  const newCrc = calculateCRC16(newQrisWithoutCrc);

  return `${newQrisWithoutCrc}${newCrc}`;
}

let currentInvoiceNo = null;
let currentQrisAmount = 0;

function getSelectedPaymentChannel() {
  const radio = document.querySelector('input[name="payment_channel"]:checked');
  return radio ? radio.value : 'qris';
}

function updateQrisDisplay() {
  const selectedKey = productEl.value;
  const product = products[selectedKey];
  const channel = getSelectedPaymentChannel();
  const qrisContainer = document.getElementById("qrisContainer");

  if (channel === 'qris' && product && currentUser) {
    qrisContainer.style.display = 'block';
    payBtn.style.display = 'none';

    if (!currentInvoiceNo) {
      currentInvoiceNo = `INV-DANA-${Date.now().toString().slice(-6)}-${Math.floor(100 + Math.random() * 900)}`;
    }
    currentQrisAmount = product.price;

    document.getElementById("qrisAmountDisplay").textContent = formatRupiah(currentQrisAmount);
    document.getElementById("qrisInvoiceDisplay").textContent = `${currentInvoiceNo} • ${product.name}`;

    // Render QRCode QRIS DANA Dinamis (Standar EMVCo Bank Indonesia)
    const qrDisplay = document.getElementById("qrisQrDisplay");
    qrDisplay.innerHTML = "";
    
    const qrContent = generateDynamicQris(currentQrisAmount);
    
    new QRCode(qrDisplay, {
      text: qrContent,
      width: 170,
      height: 170,
      colorDark : "#000000",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.M
    });

    // Simpan transaksi pending QRIS DANA ke Firebase
    savePendingQrisTransaction(currentInvoiceNo, product, selectedKey);
  } else {
    qrisContainer.style.display = 'none';
    payBtn.style.display = 'block';
  }
}

async function savePendingQrisTransaction(invoiceNo, product, selectedKey) {
  if (!currentUser) return;
  try {
    await db.ref(`transactions/${invoiceNo}`).update({
      customer_name: nameEl.value.trim() || currentUser.displayName || 'Customer',
      customer_email: emailEl.value.trim() || currentUser.email || '',
      product_name: product.name,
      product_id: selectedKey,
      amount: product.price,
      token_amount: product.token_amount || 0,
      payment_provider: 'QRIS_DANA',
      payment_method: 'QRIS',
      status: 'pending',
      uid: currentUser.uid,
      user_id: currentUser.uid,
      created_at: Date.now()
    });
  } catch (e) {
    console.warn("Gagal auto-record transaksi pending QRIS:", e);
  }
}

// Handler WhatsApp Konfirmasi
document.getElementById("confirmWaBtn").addEventListener("click", () => {
  if (!currentUser || !currentInvoiceNo) return;
  const selectedKey = productEl.value;
  const product = products[selectedKey] || { name: 'Token', price: currentQrisAmount };
  const adminWa = "6282189392233"; // Nomor WhatsApp Admin

  const text = `Halo Admin Math315, saya telah melakukan pembayaran via *QRIS DANA*:\n\n` +
    `📄 *No Invoice:* ${currentInvoiceNo}\n` +
    `👤 *Nama:* ${nameEl.value.trim() || currentUser.displayName || 'User'}\n` +
    `📧 *Email:* ${emailEl.value.trim() || currentUser.email || ''}\n` +
    `📦 *Paket:* ${product.name}\n` +
    `💰 *Nominal Transfer:* ${formatRupiah(product.price)}\n` +
    `🆔 *UID:* ${currentUser.uid}\n\n` +
    `Mohon konfirmasi dan aktivasi tokennya. Terima kasih!`;

  window.open(`https://wa.me/${adminWa}?text=${encodeURIComponent(text)}`, '_blank');
});

document.querySelectorAll('input[name="payment_channel"]').forEach(r => {
  r.addEventListener('change', () => {
    updateQrisDisplay();
    validateForm();
  });
});

function validateForm() {
  const phoneOk = validPhone(phoneEl.value.trim());
  const productSelected = productEl.value !== "" && productEl.value !== null;
  const userLoggedIn = currentUser !== null;

  payBtn.disabled = !(phoneOk && productSelected && userLoggedIn);
  phoneEl.style.borderColor = (!phoneOk && phoneEl.value) ? "#dc3545" : "#e0e0e0";
}

phoneEl.addEventListener("input", validateForm);
productEl.addEventListener("change", () => {
  const selectedKey = productEl.value;
  const product = products[selectedKey];
  if (selectedKey && product) {
    priceEl.innerHTML = `${formatRupiah(product.price)}<br><small>${product.name}</small>`;
  } else {
    priceEl.innerHTML = "Rp -";
  }
  currentInvoiceNo = null; // reset invoice untuk produk baru
  updateQrisDisplay();
  validateForm();
});

// ============================================================
// 🔐 TOMBOL LOGIN GOOGLE
// ============================================================
loginBtn.addEventListener('click', async () => {
  const provider = new firebase.auth.GoogleAuthProvider();
  loginBtn.disabled = true;
  loginBtn.textContent = '⏳ Memproses...';
  setStatus('⏳ Mengarahkan ke Google...', 'info');
  try {
    await auth.signInWithPopup(provider);
  } catch (error) {
    console.error('❌ Login gagal:', error);
    let errorMsg = error.message;
    if (error.code === 'auth/popup-blocked') errorMsg = 'Popup diblokir oleh browser. Izinkan popup untuk situs ini.';
    else if (error.code === 'auth/popup-closed-by-user') errorMsg = 'Popup ditutup sebelum login selesai. Coba lagi.';
    setStatus(`❌ ${errorMsg}`, 'error');
    loginBtn.disabled = false;
    loginBtn.textContent = 'Login dengan Google';
  }
});

// ============================================================
// 💳 SUBMIT PEMBAYARAN GATEWAY
// ============================================================
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  if (!currentUser) { alert("Anda belum login. Silakan login terlebih dahulu."); return; }
  if (!userToken) { alert("Token autentikasi tidak tersedia. Refresh halaman."); return; }
  const selectedKey = productEl.value;
  if (!selectedKey) { alert("Pilih produk terlebih dahulu."); return; }
  const selectedProduct = products[selectedKey];
  if (!selectedProduct) { alert("Produk tidak valid."); return; }
  const phone = phoneEl.value.trim();
  if (!validPhone(phone)) { alert("Nomor WhatsApp tidak valid. Gunakan format 08xxxxxxxxxx"); return; }

  payBtn.disabled = true;
  setStatus('<span class="loading"></span> Memproses transaksi...', "info");

  try {
    await db.ref(`users/${currentUser.uid}`).update({
      phone, name: nameEl.value.trim(), updated_at: Date.now()
    });
    const timestamp = Date.now();
    const invoice = `INV${timestamp.toString().slice(-8)}${Math.random().toString(36).substring(2, 5).toUpperCase()}`;
    const sanitizedProductName = (selectedProduct.name || "Product")
      .replace(/[^a-zA-Z0-9 ]/g, " ")
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, 50) || "Product";

    const amount = Number(selectedProduct.price);
    const tokenAmount = selectedProduct.token_amount || 0;

    const apiPayload = {
      invoice_no: invoice,
      amount,
      cust_name: nameEl.value.trim(),
      cust_email: emailEl.value.trim(),
      msisdn: phone,
      uid: currentUser.uid,
      token_amount: tokenAmount,
      item: [{ product: sanitizedProductName, qty: 1, amount }]
    };

    const res = await fetch(`${API_BASE}/api/create-transaction`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${userToken}` },
      body: JSON.stringify(apiPayload)
    });
    const responseText = await res.text();
    let data;
    try { data = JSON.parse(responseText); } catch (parseError) { throw new Error(`Server error: ${responseText.substring(0, 100)}`); }
    if (!res.ok || !data.success) throw new Error(data.message || `Transaksi gagal (${res.status})`);
    if (!data.payment_url) throw new Error("Payment URL tidak ditemukan dalam response");

    const billNo = data.bill_no || invoice;
    await db.ref(`transactions/${billNo}`).update({
      product_id: selectedKey, user_id: currentUser.uid, status: 'pending', created_at: Date.now()
    });

    setStatus("✅ Transaksi berhasil! Mengarahkan ke halaman pembayaran...", "success");
    localStorage.setItem("last_bill_no", billNo);
    localStorage.setItem("last_trx_id", data.trx_id || billNo);
    setTimeout(() => { window.location.href = data.payment_url; }, 1500);
  } catch (err) {
    console.error("❌ Error transaksi:", err);
    let errorMessage = err.message;
    if (errorMessage.includes("Failed to connect") || errorMessage.includes("fetch")) {
      errorMessage = "Gagal terhubung ke server pembayaran. Silakan coba lagi.";
    }
    setStatus(`❌ ${errorMessage}`, "error");
    payBtn.disabled = false;
    validateForm();
  }
});

  if (!currentUser) setStatus("⏳ Belum login? Klik tombol 'Login dengan Google' di bawah.", "warning");
}, 5000);
</script>
