<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Firebase Products - Math315</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 20px;
      margin-top: 0;
      color: #38bdf8;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px 20px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
      margin-right: 10px;
      margin-top: 10px;
    }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .btn-green { background: #16a34a; }
    .btn-green:hover { background: #15803d; }
    pre {
      background: #090d16;
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 12px;
      color: #a5f3fc;
      max-height: 250px;
    }
    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
    }
    .info { background: #075985; color: #e0f2fe; }
    .success { background: #166534; color: #dcfce7; }
    .error { background: #991b1b; color: #fee2e2; }
  </style>
</head>
<body>

<div class="container">
  <h1>⚡ Import Produk ke Firebase Realtime Database</h1>
  <p style="color: #94a3b8; font-size: 14px;">
    Halaman ini akan langsung memasukkan data produk ke node <code>/product</code> di Firebase.
  </p>

  <div id="userSection" style="margin-bottom: 20px;">
    <span id="userInfo" style="font-size: 14px; color: #cbd5e1;">Memeriksa status login...</span>
  </div>

  <div>
    <button id="loginBtn" style="display: none;">🔑 Login Google Admin</button>
    <button id="importBtn" class="btn-green" disabled>🚀 Masukkan Data ke Firebase /product</button>
  </div>

  <div id="status" class="info">Memeriksa status...</div>

  <h3 style="margin-top: 25px; font-size: 14px; color: #94a3b8;">Preview Data JSON yang akan dimasukkan:</h3>
  <pre id="jsonPreview"></pre>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCu4GQa-EOaPhpQP_y_QcsJxs05adQU2-M",
  authDomain: "math314-app.firebaseapp.com",
  databaseURL: "https://math314-app-default-rtdb.firebaseio.com",
  projectId: "math314-app",
  storageBucket: "math314-app.appspot.com",
  messagingSenderId: "9019551034",
  appId: "1:9019551034:web:de0c5e2b8b20c18ca0b403"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const PRODUCT_DATA = {
  "token_50": {
    "name": "Paket Starter 50 Token",
    "description": "50 Token Belajar dan Simulasi CBT",
    "price": 10000,
    "token_amount": 50
  },
  "token_200": {
    "name": "Paket Pro 200 Token",
    "description": "200 Token Belajar dan Simulasi CBT",
    "price": 35000,
    "token_amount": 200
  },
  "token_500": {
    "name": "Paket Business 500 Token",
    "description": "500 Token Belajar dan Simulasi CBT",
    "price": 75000,
    "token_amount": 500
  },
  "token_1500": {
    "name": "Paket Enterprise 1500 Token",
    "description": "1500 Token Belajar dan Simulasi CBT",
    "price": 150000,
    "token_amount": 1500
  },
  "poster_matematika": {
    "name": "Poster Rumus Matematika SMA Lengkap",
    "description": "Poster A3 Plus Bahan Art Paper 260 gsm Glossy Laminated",
    "price": 8500,
    "token_amount": 0
  },
  "poster_kimia": {
    "name": "Poster Tabel Periodik Unsur Kimia Modern",
    "description": "Poster A3 Plus 118 Unsur IUPAC Lengkap HD",
    "price": 9000,
    "token_amount": 0
  },
  "poster_fisika": {
    "name": "Poster Hukum Fisika Gaya dan Tata Surya",
    "description": "Poster A3 Plus Rumus Fisika dan Tata Surya Semesta",
    "price": 9500,
    "token_amount": 0
  },
  "poster_biologi": {
    "name": "Poster Anatomi Tubuh Manusia Organ Lengkap",
    "description": "Poster A3 Plus Infografis Biologi Medis HD",
    "price": 9000,
    "token_amount": 0
  },
  "poster_geografi": {
    "name": "Poster Peta Struktur Lapisan Bumi dan Batuan",
    "description": "Poster A3 Plus Infografis Geologi dan Litosfer",
    "price": 8500,
    "token_amount": 0
  }
};

document.getElementById('jsonPreview').textContent = JSON.stringify(PRODUCT_DATA, null, 2);

const statusEl = document.getElementById('status');
const userInfoEl = document.getElementById('userInfo');
const loginBtn = document.getElementById('loginBtn');
const importBtn = document.getElementById('importBtn');

auth.onAuthStateChanged(user => {
  if (user) {
    userInfoEl.innerHTML = `👤 Login sebagai: <strong>${user.displayName || user.email}</strong> (${user.email})`;
    loginBtn.style.display = 'none';
    importBtn.disabled = false;
    statusEl.className = 'info';
    statusEl.textContent = 'Siap memasukkan data. Silakan klik tombol hijau di atas.';
  } else {
    userInfoEl.textContent = 'Belum login.';
    loginBtn.style.display = 'inline-block';
    importBtn.disabled = true;
    statusEl.className = 'error';
    statusEl.textContent = 'Silakan login terlebih dahulu untuk mendapatkan izin akses tulis ke database.';
  }
});

loginBtn.addEventListener('click', () => {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => {
    statusEl.className = 'error';
    statusEl.textContent = 'Gagal login: ' + err.message;
  });
});

importBtn.addEventListener('click', async () => {
  importBtn.disabled = true;
  statusEl.className = 'info';
  statusEl.textContent = '⏳ Sedang menyimpan data ke /product di Firebase...';

  try {
    await db.ref('product').set(PRODUCT_DATA);
    statusEl.className = 'success';
    statusEl.innerHTML = '🎉 <strong>Berhasil!</strong> Semua data produk telah tersimpan di node <code>/product</code> Firebase.';
    importBtn.disabled = false;
  } catch (err) {
    statusEl.className = 'error';
    statusEl.innerHTML = '❌ <strong>Gagal menyimpan:</strong> ' + err.message;
    importBtn.disabled = false;
  }
});
</script>
</body>
</html>
